<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Trim Pro">
  <rect width="1200" height="360" fill="#2E4A59"/>
  <g fill="#E6C98B" font-family="Poppins, Montserrat, Inter, Arial, Helvetica, sans-serif">
    <text x="78" y="242" font-size="184" font-weight="800" letter-spacing="0.4">trimpro</text>
  </g>
  <g fill="#ffffff" transform="translate(900,64)">
    <!-- Top beam -->
    <rect x="0" y="0" width="220" height="20" rx="4"/>
    <!-- Side guide dots (aligned to same baseline) -->
    <circle cx="22" cy="40" r="12"/>
    <circle cx="198" cy="40" r="12"/>
    <!-- Main icon uprights -->
    <rect x="76" y="56" width="30" height="168" rx="4"/>
    <rect x="124" y="56" width="30" height="168" rx="4"/>
    <!-- Cross tie to visually center the icon -->
    <rect x="76" y="106" width="78" height="14" rx="3"/>
  </g>
</svg>
